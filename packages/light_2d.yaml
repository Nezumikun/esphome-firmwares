esphome:
  on_boot:
    priority: 600
    then:
      - light.control:
          id: neopixel_strip
          state: on

nezumikun_light_2d:
  id: light_2d
  light_id: neopixel_strip
  width: ${canvas_width}
  height: ${canvas_height}

light:
  - platform: neopixelbus
    variant: WS2812
    pin: ${strip_pin}
    num_leds: ${strip_num_leds}
    type: ${strip_rgb_order}
    name: "WS2812B Light"
    id: neopixel_strip
    on_turn_on:
      - light.control:
          id: neopixel_strip
          effect: "Demo"
    effects:
      - addressable_lambda:
          name: "Demo"
          update_interval: 500ms
          lambda: |-
            if (initial_run) {
              it.all() = Color::BLACK;
              return;
            }
            id(light_2d).set_effect_active(true);

