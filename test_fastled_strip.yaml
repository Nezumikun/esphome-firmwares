substitutions:
  devicename: test-led-strip
  platform: ESP8266
  board: nodemcuv2
#  board: esp01_1m
  devicedescr: LED Strip
  strip_num_leds: '30'
  strip_rgb_order: GRB
  strip_pin: GPIO4
  alive_pin: GPIO2
  canvas_width: 6
  canvas_height: 5
  initial_brightness: 25%

esphome:
  name: ${devicename}

esp8266:
  board: ${board}

web_server:
  port: 80

packages:
  wifi: !include packages/network.yaml
  base_settings: !include packages/base_settings_for_dev.yaml
  nezumikun_light_2d: !include packages/light_2d.yaml
  alive_led: !include packages/alive_led.yaml

logger:
  logs:
    sensor: ERROR
    text_sensor: ERROR